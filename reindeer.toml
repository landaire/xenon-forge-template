# reindeer writes third-party/rust/BUCK from third-party/rust/Cargo.toml:
#
#     reindeer buckify
#
# Crates are not vendored. Buck2 downloads each one from crates.io and
# checks it against the checksum in third-party/rust/Cargo.lock. Fixups for
# build scripts are in third-party/rust/fixups/<crate>/fixups.toml.
manifest_path = "third-party/rust/Cargo.toml"
third_party_dir = "third-party/rust"
precise_srcs = false
cargo_env = true
vendor = false

# The console, with the cfg values of `rustc --print cfg` for
# powerpc-unknown-xbox360. third-party/rust/PACKAGE selects this platform for
# targets configured for the console, so `cfg` dependencies of a crate
# resolve as rustc evaluates them there.
[platform.xbox360]
execution-platform = false
target_arch = ["powerpc"]
target_endian = ["big"]
target_env = [""]
target_family = []
target_feature = []
target_has_atomic = ["16", "32", "8", "ptr"]
target_os = ["xbox360"]
target_pointer_width = ["32"]
target_vendor = ["unknown"]

# The hosts, for proc-macro crates and build scripts, which run where Buck2
# runs. Features that only they enable stay out of console builds.
[platform.linux-x86_64]
execution-platform = true
target = "x86_64-unknown-linux-gnu"
target_arch = ["x86_64"]
target_env = ["gnu"]
target_family = ["unix"]
target_os = ["linux"]
target_pointer_width = ["64"]
target_vendor = ["unknown"]
target_endian = ["little"]
target_feature = ["fxsr", "sse", "sse2"]
target_has_atomic = ["16", "32", "64", "8", "ptr"]

[platform.linux-arm64]
execution-platform = true
target = "aarch64-unknown-linux-gnu"
target_arch = ["aarch64"]
target_env = ["gnu"]
target_family = ["unix"]
target_os = ["linux"]
target_pointer_width = ["64"]
target_vendor = ["unknown"]
target_endian = ["little"]
target_feature = ["neon"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]

[platform.macos-arm64]
execution-platform = true
target = "aarch64-apple-darwin"
target_arch = ["aarch64"]
target_env = [""]
target_family = ["unix"]
target_os = ["macos"]
target_pointer_width = ["64"]
target_vendor = ["apple"]
target_endian = ["little"]
target_feature = ["neon", "aes", "sha2"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]

[platform.macos-x86_64]
execution-platform = true
target = "x86_64-apple-darwin"
target_arch = ["x86_64"]
target_env = [""]
target_family = ["unix"]
target_os = ["macos"]
target_pointer_width = ["64"]
target_vendor = ["apple"]
target_endian = ["little"]
target_feature = ["fxsr", "sse", "sse2", "sse3", "ssse3"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]

[platform.windows-msvc]
execution-platform = true
target = "x86_64-pc-windows-msvc"
target_arch = ["x86_64"]
target_env = ["msvc"]
target_family = ["windows"]
target_os = ["windows"]
target_pointer_width = ["64"]
target_vendor = ["pc"]
target_endian = ["little"]
target_feature = ["fxsr", "sse", "sse2"]
target_has_atomic = ["16", "32", "64", "8", "ptr"]

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
